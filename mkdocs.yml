site_name: Mathy Documentation
site_description: Documentation for the Mathy statistical modeling and machine learning utility library.
site_author: Terry D. Eppler
site_url: ""

repo_url: ""
repo_name: ""

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.select
  palette:
    - scheme: slate
      primary: blue
      accent: blue
  font:
    text: Roboto
    code: Roboto Mono

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - .
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            filters:
              - "!^_"

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Architecture: architecture.md
  - User Guide:
      - Overview: user-guide/index.md
      - Data Preparation: user-guide/data-preparation.md
      - Feature Engineering: user-guide/feature-engineering.md
      - Modeling: user-guide/modeling.md
      - Forecasting: user-guide/forecasting.md
  - API Reference:
      - Overview: api/index.md
      - Data: api/data.md
      - Scalers: api/scalers.md
      - Encoders: api/encoders.md
      - Imputers: api/imputers.md
      - Transformers: api/transformers.md
      - Features: api/features.md
      - Clusters: api/clusters.md
      - Outliers: api/outliers.md
      - Regressions: api/regressions.md
      - Classifications: api/classifications.md
      - Forecasting: api/forecasting.md
  - Development: development.md